<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chase Place Quantum</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   RESET & TOKENS
───────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04070f;--surf:#09111e;--surf2:#0e1929;--surf3:#142035;
  --border:#1a2d44;--border2:#22395a;
  --text:#c4d8f5;--dim:#6e94be;--faint:#4a6a8a;
  --gold:#00d4ff;--gold2:#0099cc;
  --green:#00e5aa;--red:#ff4a68;--blue:#5aadff;--purple:#b87aff;--orange:#ff8a4a;
  --cyan-glow:rgba(0,212,255,.15);--cyan-dim:rgba(0,212,255,.08);
  --mono:'DM Mono',monospace;--ui:'Space Grotesk',sans-serif;
  --r:10px;--r2:7px;
}
body{background:var(--bg);color:var(--text);font-family:var(--ui);min-height:100vh;overflow-x:hidden}

/* ─────────────────────────────────────────────
   LAYOUT
───────────────────────────────────────────── */
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:210px;min-width:210px;background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}

/* ─────────────────────────────────────────────
   SIDEBAR
───────────────────────────────────────────── */
.brand{padding:18px 16px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(0,212,255,.04) 0%,transparent 100%)}
.brand-name{font-size:14px;font-weight:700;letter-spacing:.5px;font-family:'Orbitron',sans-serif;line-height:1.3}
.brand-name em{color:var(--gold);font-style:normal;text-shadow:0 0 18px rgba(0,212,255,.6);display:block;font-size:18px;letter-spacing:1px}
.brand-tag{font-size:9px;font-family:var(--mono);color:var(--faint);letter-spacing:2px;margin-top:4px;text-transform:uppercase}
.nav{padding:8px 0;flex:1}
.ni{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:12.5px;font-weight:600;color:var(--dim);cursor:pointer;border-left:2px solid transparent;transition:all .12s;letter-spacing:.2px}
.ni:hover{color:var(--text);background:var(--surf2)}
.ni.on{color:var(--gold);border-left-color:var(--gold);background:var(--cyan-dim);box-shadow:inset 0 0 12px rgba(0,212,255,.05)}
.ni .ic{font-size:15px;width:18px;text-align:center}
.side-foot{padding:14px 16px;border-top:1px solid var(--border);font-family:var(--mono)}
.sf-row{margin-bottom:6px}
.sf-lbl{font-size:9px;color:var(--faint);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.sf-val{font-size:13px;font-weight:500}
.sf-val.g{color:var(--green)}.sf-val.r{color:var(--red)}.sf-val.o{color:var(--gold)}

/* ─────────────────────────────────────────────
   TOPBAR
───────────────────────────────────────────── */
.topbar{padding:14px 24px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:12px;background:var(--surf2);position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.pg-title{font-size:17px;font-weight:700;flex:1}
.pg-sub{font-size:13px;color:var(--text);font-family:var(--mono);margin-left:8px;font-weight:400;opacity:.85}
.pg-sub .stat-num{color:var(--gold);font-weight:600}
.pg-sub .stat-money{color:var(--green);font-weight:600}
.pg-sub .stat-sep{color:var(--faint);margin:0 5px}

/* ─────────────────────────────────────────────
   CONTENT
───────────────────────────────────────────── */
.content{padding:20px 24px;flex:1}

/* ─────────────────────────────────────────────
   STAT CARDS
───────────────────────────────────────────── */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:24px}
.sc{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.sc-lbl{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-family:var(--mono);margin-bottom:7px}
.sc-val{font-size:17px;font-weight:700;letter-spacing:-.5px;line-height:1.2;white-space:nowrap;font-family:var(--mono)}
.sc-val.g{color:var(--green)}.sc-val.r{color:var(--red)}.sc-val.o{color:var(--gold)}.sc-val.b{color:var(--blue)}
.sc-sub{font-size:11px;color:var(--faint);margin-top:3px;font-family:var(--mono)}

/* ─────────────────────────────────────────────
   BUTTONS & INPUTS
───────────────────────────────────────────── */
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.sw{position:relative;flex:1;min-width:200px}
.sw input{width:100%;background:var(--surf);border:1px solid var(--border);color:var(--text);padding:8px 26px 8px 30px;border-radius:var(--r2);font-size:12.5px;font-family:var(--ui);outline:none;transition:border .12s}
.sw input:focus{border-color:var(--gold)}
.sw .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px;pointer-events:none}
.sw .s-clr{display:none;position:absolute;right:7px;top:50%;transform:translateY(-50%);color:var(--faint);cursor:pointer;font-size:15px;line-height:1;border:none;background:none;padding:0 3px;border-radius:3px}
.sw .s-clr:hover{color:var(--text)}
.sw input:not(:placeholder-shown)~.s-clr{display:block}
select,.btn{background:var(--surf);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:var(--r2);font-size:12.5px;font-family:var(--ui);cursor:pointer;outline:none;transition:all .12s}
.btn{font-weight:600}
.btn:hover{background:var(--surf2);border-color:var(--border2)}
.btn.pri{background:var(--gold);color:#040810;border-color:var(--gold);font-weight:700;box-shadow:0 0 14px rgba(0,212,255,.25)}
.btn.pri:hover{background:var(--gold2);box-shadow:0 0 20px rgba(0,212,255,.4)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.xs{padding:3px 7px;font-size:10px;font-family:var(--mono)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--dim)}
.btn.ghost:hover{color:var(--text);border-color:var(--border2)}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.red:hover{background:rgba(224,82,82,.1)}

/* ─────────────────────────────────────────────
   OVERLAY & PANEL
───────────────────────────────────────────── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:flex-start;justify-content:flex-end;padding:0}
.ov.open{display:flex}
.pn{background:var(--surf);border-left:1px solid var(--border);width:560px;max-width:100vw;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.pn-head{padding:18px 20px 16px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:flex-start;position:sticky;top:0;background:var(--surf);z-index:5}
.pn-title{font-size:14px;font-weight:700;line-height:1.4;margin-bottom:4px}
.pn-meta{font-size:11px;color:var(--dim);font-family:var(--mono)}
.pn-close{margin-left:auto;font-size:18px;cursor:pointer;color:var(--dim);flex-shrink:0;padding:2px 6px;border-radius:4px;line-height:1}
.pn-close:hover{color:var(--text);background:var(--surf2)}
.pn-body{padding:18px 20px;flex:1}
.ps{margin-bottom:20px}
.ps-title{font-size:9px;letter-spacing:1px;text-transform:uppercase;font-family:var(--mono);color:var(--faint);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}

/* ─────────────────────────────────────────────
   FORM FIELDS
───────────────────────────────────────────── */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-item label{font-size:9px;color:var(--faint);font-family:var(--mono);letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:4px}
.field-val{font-size:13px;font-weight:600;min-height:20px}
.field-input{width:100%;background:var(--surf2);border:1px solid var(--border2);color:var(--text);padding:6px 8px;border-radius:5px;font-size:12px;font-family:var(--ui);outline:none;transition:border .12s}
.field-input:focus{border-color:var(--gold)}
.field-input.mono{font-family:var(--mono)}
.cb-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.cb-row input[type=checkbox]{accent-color:var(--gold);cursor:pointer}

/* ─────────────────────────────────────────────
   TABLE
───────────────────────────────────────────── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;padding:8px 10px;font-size:9px;font-family:var(--mono);letter-spacing:1px;color:var(--faint);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
thead th.sh{cursor:pointer}
thead th.sh:hover{color:var(--text)}
thead th.sh.on{color:var(--gold)}
tbody tr{border-bottom:1px solid var(--border);transition:background .08s}
tbody tr:hover{background:var(--surf2);cursor:pointer}
td{padding:8px 10px;vertical-align:middle}

/* ─────────────────────────────────────────────
   PARSED TAGS & BADGES
───────────────────────────────────────────── */
.ptags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.pt{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;font-size:9px;font-family:var(--mono);font-weight:500;letter-spacing:.3px;background:var(--surf3);border:1px solid var(--border);color:var(--dim);white-space:nowrap;height:18px;line-height:14px}
.pt.year{border-color:rgba(77,166,255,.3);color:var(--blue)}
.pt.set{border-color:rgba(164,126,245,.3);color:var(--purple)}
.pt.serial{border-color:rgba(0,212,255,.4);color:var(--gold)}
.pt.auto{border-color:rgba(245,130,74,.3);color:var(--orange)}
.pt.rc{border-color:rgba(46,204,138,.3);color:var(--green)}
.pt.grade{border-color:rgba(224,82,82,.4);color:var(--red)}
.pt.var{border-color:rgba(142,162,184,.2);color:var(--dim)}
.tb{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9px;font-family:var(--mono);font-weight:500;letter-spacing:.5px}
.sb{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9px;font-family:var(--mono);font-weight:500;letter-spacing:.3px}
.sb.sold{background:rgba(224,82,82,.1);color:var(--red);border:1px solid rgba(224,82,82,.2)}
.sb.stock{background:rgba(46,204,138,.1);color:var(--green);border:1px solid rgba(46,204,138,.2)}
.pr{font-family:var(--mono);font-weight:500}
.pr.g{color:var(--green)}.pr.r{color:var(--red)}.pr.o{color:var(--gold)}.pr.d{color:var(--dim)}

/* ─────────────────────────────────────────────
   MISC
───────────────────────────────────────────── */
.sep{border:none;border-top:1px solid var(--border);margin:14px 0}
.empty{text-align:center;padding:50px 20px;color:var(--dim)}
.empty .ei{font-size:36px;margin-bottom:10px}
.alert{padding:10px 14px;border-radius:7px;font-size:12px;margin-bottom:12px}
.alert.warn{background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.2);color:var(--gold)}
.alert.info{background:rgba(77,166,255,.08);border:1px solid rgba(77,166,255,.2);color:var(--blue)}
.alert.err{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.2);color:var(--red)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surf2);border:1px solid var(--border2);border-radius:8px;padding:10px 16px;font-size:12px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;font-family:var(--mono)}
.toast.show{opacity:1}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}
input[type=text],input[type=number],textarea{caret-color:var(--gold)}
</style>
</head>
<body>
<div class="shell">

  <!-- ── SIDEBAR ── -->
  <aside class="side">
    <div class="brand">
      <div class="brand-name">Chase Place<em>QUANTUM</em></div>
      <div class="brand-tag">Card Portfolio v2</div>
    </div>
    <nav class="nav" id="nav">
      <div class="ni on" data-page="dashboard" onclick="nav('dashboard')"><span class="ic">◈</span> Dashboard</div>
      <div class="ni" data-page="inventory" onclick="nav('inventory')"><span class="ic">▦</span> Inventory</div>
      <div class="ni" data-page="sales" onclick="nav('sales')"><span class="ic">◎</span> Sales</div>
      <div class="ni" data-page="import" onclick="nav('import')"><span class="ic">⇪</span> Import</div>
      <div class="ni" data-page="receive" onclick="nav('receive')"><span class="ic">⬓</span> Receive</div>
      <div class="ni" data-page="analytics" onclick="nav('analytics')"><span class="ic">⌬</span> Analytics</div>
      <div class="ni" data-page="settings" onclick="nav('settings')"><span class="ic">⚙</span> Settings</div>
    </nav>
    <div class="side-foot" id="side-foot">
      <div class="sf-row">
        <div class="sf-lbl">Inventory</div>
        <div class="sf-val o" id="sf-inv">—</div>
      </div>
      <div class="sf-row">
        <div class="sf-lbl">Cost Basis</div>
        <div class="sf-val" id="sf-cost">—</div>
      </div>
      <div class="sf-row">
        <div class="sf-lbl">Revenue</div>
        <div class="sf-val g" id="sf-rev">—</div>
      </div>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main" id="main">
    <!-- topbar and content rendered by JS -->
  </main>

</div>

<!-- ── OVERLAY PANEL ── -->
<div class="ov" id="ov" onclick="if(event.target===this)closePanel()">
  <div class="pn" id="pn"></div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════
   §1  CONFIG
══════════════════════════════════════════════════════ */
const CFG = {
  APP:       'Chase Place Quantum',
  VERSION:   '2.0.0',
  PAGE_SIZE: 50,
  CARD_TYPES: ['Soccer','Pokémon','NFL','MLB','Marvel','NBA','Yu-Gi-Oh'],
};

/* ══════════════════════════════════════════════════════
   §2  DB  (localStorage — Supabase-ready async interface)
   Swap this section for a Supabase implementation later;
   all callers use await DB.method() already.
══════════════════════════════════════════════════════ */
const DB = {
  KEYS: {
    CARDS:          'cpq_cards',
    SALES:          'cpq_sales',
    CHECKLISTS:     'cpq_checklists',
    CUSTOM_PLAYERS: 'cpq_custom_players',
    CUSTOM_TYPES:   'cpq_custom_types',
    CATEGORY_DEFS:  'cpq_category_defs',
    VALUE_LOOKUPS:  'cpq_value_lookups',
    META:           'cpq_meta',
  },

  _read(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
    catch { return fallback; }
  },
  _write(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) { console.error('DB write', key, e); }
  },

  async load() {
    return {
      cards:          DB._read(DB.KEYS.CARDS,          []),
      sales:          DB._read(DB.KEYS.SALES,          []),
      checklists:     DB._read(DB.KEYS.CHECKLISTS,     []),
      custom_players: DB._read(DB.KEYS.CUSTOM_PLAYERS, []),
      custom_types:   DB._read(DB.KEYS.CUSTOM_TYPES,   []),
      category_defs:  DB._read(DB.KEYS.CATEGORY_DEFS,  []),
      value_lookups:  DB._read(DB.KEYS.VALUE_LOOKUPS,  {}),
    };
  },

  async saveCards(cards)        { DB._write(DB.KEYS.CARDS, cards); },
  async saveSales(sales)        { DB._write(DB.KEYS.SALES, sales); },

  async saveCard(card) {
    const cards = DB._read(DB.KEYS.CARDS, []);
    const idx = cards.findIndex(c => c.id === card.id);
    if (idx >= 0) cards[idx] = card; else cards.push(card);
    DB._write(DB.KEYS.CARDS, cards);
  },

  async saveSale(sale) {
    const sales = DB._read(DB.KEYS.SALES, []);
    const idx = sales.findIndex(s => s.id === sale.id);
    if (idx >= 0) sales[idx] = sale; else sales.push(sale);
    DB._write(DB.KEYS.SALES, sales);
  },

  async saveMeta(key, value) {
    const meta = DB._read(DB.KEYS.META, {});
    meta[key] = value;
    DB._write(DB.KEYS.META, meta);
  },

  getMeta(key, fallback = null) {
    return DB._read(DB.KEYS.META, {})[key] ?? fallback;
  },

  async saveValueLookup(id, data) {
    const vl = DB._read(DB.KEYS.VALUE_LOOKUPS, {});
    vl[id] = data;
    DB._write(DB.KEYS.VALUE_LOOKUPS, vl);
  },

  async exportBackup() {
    const photoCount = await PhotoDB.countAll().catch(() => 0);
    const data = {
      version:       CFG.VERSION,
      exported_at:   new Date().toISOString(),
      photo_count:   photoCount,
      cards:         DB._read(DB.KEYS.CARDS,  []),
      sales:         DB._read(DB.KEYS.SALES,  []),
      meta:          DB._read(DB.KEYS.META,   {}),
      value_lookups: DB._read(DB.KEYS.VALUE_LOOKUPS, {}),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `cpq-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  },

  async importBackup(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data.cards))  throw new Error('Invalid backup: missing cards array');
          if (!Array.isArray(data.sales))  throw new Error('Invalid backup: missing sales array');
          DB._write(DB.KEYS.CARDS,  data.cards);
          DB._write(DB.KEYS.SALES,  data.sales);
          if (data.meta)          DB._write(DB.KEYS.META, data.meta);
          if (data.value_lookups) DB._write(DB.KEYS.VALUE_LOOKUPS, data.value_lookups);
          resolve(data);
        } catch(err) { reject(err); }
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file);
    });
  },
};

/* ══════════════════════════════════════════════════════
   §2.5  PhotoDB  (IndexedDB — device-local photo store)
   Photos live outside the JSON backup (IndexedDB ~50MB+).
   Card records store photo keys; dataUrls fetched on demand.
   Phase 2: swap put/getAll to Supabase Storage, no other changes.
══════════════════════════════════════════════════════ */
const PhotoDB = {
  DB_NAME:    'cpq_photos',
  DB_VERSION: 1,
  STORE:      'photos',
  _db:        null,

  async open() {
    if (this._db) return this._db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(this.STORE)) {
          const s = db.createObjectStore(this.STORE, { keyPath: 'key' });
          s.createIndex('cardId', 'cardId', { unique: false });
        }
      };
      req.onsuccess = e => { this._db = e.target.result; resolve(this._db); };
      req.onerror   = e => reject(e.target.error);
    });
  },

  _key(cardId, index) { return `${cardId}::${index}`; },

  async put(cardId, index, dataUrl) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readwrite');
      tx.objectStore(this.STORE).put({ key: this._key(cardId, index), cardId, index, dataUrl });
      tx.oncomplete = () => resolve();
      tx.onerror    = e => reject(e.target.error);
    });
  },

  async getAll(cardId) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx    = db.transaction(this.STORE, 'readonly');
      const idx   = tx.objectStore(this.STORE).index('cardId');
      const range = IDBKeyRange.only(cardId);
      const req   = idx.getAll(range);
      req.onsuccess = e => {
        const rows = e.target.result || [];
        rows.sort((a, b) => a.index - b.index);
        resolve(rows.map(r => r.dataUrl));
      };
      req.onerror = e => reject(e.target.error);
    });
  },

  async delete(cardId, index) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readwrite');
      tx.objectStore(this.STORE).delete(this._key(cardId, index));
      tx.oncomplete = () => resolve();
      tx.onerror    = e => reject(e.target.error);
    });
  },

  async deleteAll(cardId) {
    const db    = await this.open();
    const keys  = await new Promise((resolve, reject) => {
      const tx    = db.transaction(this.STORE, 'readonly');
      const idx   = tx.objectStore(this.STORE).index('cardId');
      const req   = idx.getAllKeys(IDBKeyRange.only(cardId));
      req.onsuccess = e => resolve(e.target.result || []);
      req.onerror   = e => reject(e.target.error);
    });
    if (!keys.length) return 0;
    return new Promise((resolve, reject) => {
      const tx    = db.transaction(this.STORE, 'readwrite');
      const store = tx.objectStore(this.STORE);
      keys.forEach(k => store.delete(k));
      tx.oncomplete = () => resolve(keys.length);
      tx.onerror    = e => reject(e.target.error);
    });
  },

  async countAll() {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx  = db.transaction(this.STORE, 'readonly');
      const req = tx.objectStore(this.STORE).count();
      req.onsuccess = e => resolve(e.target.result);
      req.onerror   = e => reject(e.target.error);
    });
  },
};

let _noiseStartRx = null;
function _getNoiseStartRx() {
  if (!_noiseStartRx) _noiseStartRx = new RegExp(
    '^(?:' + _NOISE_STARTERS.map(n => n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')\\s+', 'i'
  );
  return _noiseStartRx;
}

function cleanPlayer(raw) {
  if (!raw) return raw;
  const words = raw.trim().split(/\s+/);
  if (words.every(w => PLAYER_NOISE.has(w.toLowerCase().replace(/[^a-z]/g,'')))) return '';
  if (_NOISE_STARTERS.some(n => raw.toLowerCase().startsWith(n + ' '))) return '';
  return raw;
}

/* ── Color extraction (used by scorer) ── */
const _COLOR_WORDS = ['red','orange','yellow','gold','green','teal','aqua','blue','purple','pink','black','white','silver','bronze','rainbow','cosmic','neon','rose'];
function _extractColor(str) {
  if (!str) return '';
  const s = str.toLowerCase();
  for (const c of _COLOR_WORDS) { if (new RegExp('\\b' + c + '\\b').test(s)) return c; }
  return '';
}

/* ── Checklist player lookup map ── */
function buildPlayerMap() {
  const map = new Map();
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const cls = Store.get('checklists') || {};
  const clsObj = Array.isArray(cls) ? {} : cls;
  for (const cl of Object.values(clsObj)) {
    for (const p of (cl.players || [])) { const k = norm(p); if (!map.has(k)) map.set(k, { name:p, fromChecklist:true }); }
  }
  for (const p of (Store.get('custom_players') || [])) {
    const k = norm(p); if (!map.has(k)) map.set(k, { name:p, fromChecklist:false });
  }
  return map;
}

/* ── Standard display name builder ── */
function buildStandardName(p) {
  if (!p.player) return p.display_name || p.raw_title || '';
  const rest = [];
  if (p.is_auto && !/auto/i.test(p.variation || '')) rest.push('Auto');
  if (p.is_rc) rest.push('RC');
  if (p.serial) rest.push(p.serial.includes('/') ? p.serial : '/' + p.serial);
  if (p.year) rest.push(p.year);
  if (p.set) rest.push(p.set);
  const segments = [p.player];
  if (p.variation) segments.push(p.variation);
  if (rest.length) segments.push(rest.join(' '));
  return segments.join(' ');
}

/* ── CSV utilities ── */
function _csvSplitRow(line, delim) {
  delim = delim || ',';
  const cells = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
    else if (c === delim && !inQ) { cells.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  cells.push(cur.trim());
  return cells;
}
function _detectDelim(firstLine) {
  return (firstLine.match(/\t/g)||[]).length > (firstLine.match(/,/g)||[]).length ? '\t' : ',';
}
function _csvCols(header) {
  return names => {
    for (const name of names)
      for (let j = 0; j < header.length; j++)
        if (header[j].replace(/[^a-z0-9]/g,'').includes(name.replace(/[^a-z0-9]/g,''))) return j;
    return -1;
  };
}

    // Competition
    for (const [kw,cn] of [['UEFA Champions League','UCL'],['Champions League','UCL'],['UEFA','UEFA'],['UCL','UCL'],['Premier League','PL'],['EPL','PL'],['La Liga','La Liga'],['Bundesliga','Bundesliga'],['MLS','MLS'],['NWSL','NWSL'],['CWC','CWC'],['Serie A','Serie A'],['Ligue 1','Ligue 1']]) {
      if (t.toLowerCase().includes(kw.toLowerCase())) { out.comp=cn; break; }
    }

    // ── Player extraction ──
    let rem = t;
    rem = rem.replace(/\b(PSA|BGS|SGC|CGC|BVG)\s*\d+(?:\.\d+)?\b/gi,' ');
    rem = rem.replace(/\b(?:19|20)\d{2}(?:-\d{2,4})?\b/g,' ');
    rem = rem.replace(/#?\s*\d+\s*\/\s*\d+/g,' ').replace(/\/\s*\d+\b/g,' ').replace(/#\s*\d+\b/g,' ');
    rem = rem.replace(/\b(RC|Rookie\s*Card|Rookie|Auto|Autograph|Signed|Lot|Bundle|Collection|SIR|SAR|XRC|SP|SSP)\b/gi,' ');
    rem = rem.replace(/\b(Panini|Topps|Upper\s*Deck|Donruss|Bowman|Fleer|Score|Leaf|Select|Skybox|Stadium\s*Club|Archives|Heritage|Gallery|Classics|Contenders|Certified|Absolute|Immaculate|Majestic|Sage|Playoff|Pacific)\b/gi,' ');
    rem = rem.replace(/\b(Prizm|Chrome|Optic|Mosaic|Obsidian|National\s*Treasures|Finest|Topps\s*Now|Platinum|Luminance|Illusions|Spectra|Noir|Museum\s*Collection|Definitive|Inception|Revolution|Elements|Bowman\s*Draft)\b/gi,' ');
    rem = rem.replace(/\b(Destined\s*Rivals|Scarlet\s*&?\s*Violet|Paldea|Evolving\s*Skies|Silver\s*Tempest|Crown\s*Zenith|Temporal\s*Forces|Stellar\s*Crown|Surging\s*Sparks|Twilight\s*Masquerade)\b/gi,' ');
    rem = rem.replace(/\b(Refractor|Superfractor|Holo(?:\s+Gold|\s+Silver)?|Gold\s+Prizm|Silver\s+Prizm|Rainbow\s+Prizm|Red\s+(?:Wave|Scope|Ice|Prizm)|True\s+Blue|Blue\s+(?:Wave|Prizm)|Black\s+(?:Finite|Gold)|Gold\s+(?:Vinyl|Refractor)|Neon\s+Green\s+Refractor|White\s+Sparkle|Sparkle|Camo|Pulsar|Raywave|Lava|Mojo|Logofractor|Sapphire|Aqua|Marble|Magenta|Starball|Shockwave|Voltage|Prism|Holo|VMAX|VSTAR)\b/gi,' ');
    rem = rem.replace(/\b(Premier\s*League|La\s*Liga|Bundesliga|MLS|NWSL|FIFA|UEFA|UCL|EPL|CWC|UEL|Club\s*World\s*Cup|Champions\s*League|World\s*Cup|Super\s*Bowl|World\s*Series|Football\s*Club)\b/gi,' ');
    rem = rem.replace(/\b(Pokemon|Pok[eé]mon|TCG|Marvel|Avengers|X-?Men|Iron\s*Man|Spider-?Man|Yu-?Gi-?Oh|Yugioh|Duel\s*Monsters|NBA|NFL|MLB|NHL|NFC|AFC)\b/gi,' ');
    rem = rem.replace(/\b(Illustration\s*Rare|Full\s*Art|Base|Insert|Variation|ex\b|GX|EX)\b/gi,' ');
    rem = rem.replace(/[()[\]|\/\\#]/g,' ');
    rem = rem.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,' ').replace(/[☀-➿⬀-⯿]/g,' ');
    rem = rem.replace(/\s+/g,' ').trim();

    const _nsRx = _getNoiseStartRx();
    let playerCandidate = rem;
    for (let safety = 0; safety < 6; safety++) {
      const before = playerCandidate;
      playerCandidate = playerCandidate.replace(_nsRx,'').trim();
      if (playerCandidate === before) break;
    }

    const words = playerCandidate.split(/\s+/);
    const allGroups = []; let curGroup = [];
    for (const w of words) {
      const wl = w.toLowerCase().replace(/[^a-z]/g,'');
      if (wl.length >= 2 && !PLAYER_NOISE.has(wl) && /^[A-ZÀ-Þ][a-zß-ÿ]/.test(w)) {
        curGroup.push(w);
      } else {
        if (curGroup.length) { allGroups.push(curGroup); curGroup = []; }
      }
    }
    if (curGroup.length) allGroups.push(curGroup);

    const _pMap = buildPlayerMap();
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    let _found = null;
    const nameTokens = words.filter(w => {
      const wl = w.toLowerCase().replace(/[^a-z]/g,'');
      return wl.length >= 2 && !PLAYER_NOISE.has(wl) && /^[A-ZÀ-Þ][a-zß-ÿ]/.test(w);
    });
    if (_pMap.size > 0 && nameTokens.length > 0) {
      chkLoop: for (const wSz of [3,2,1]) {
        for (let i = 0; i <= nameTokens.length - wSz; i++) {
          const cand = nameTokens.slice(i, i+wSz).join(' ');
          const match = _pMap.get(norm(cand));
          if (match) { _found = match; break chkLoop; }
        }
      }
    }
    if (_found) {
      out.player = _found.name;
      if (!_found.fromChecklist) out._customPlayer = true;
    } else {
      const bestGroup = allGroups.find(g => g.length >= 2) || allGroups.find(g => g.length >= 1) || [];
      if (bestGroup.length) out.player = bestGroup.slice(0,3).join(' ');
      if (out.player && _pMap.size > 0) out._customPlayer = true;
    }

    if (out.player) out.display_name = buildStandardName(out);
    return out;
  },

  parseSaleTitle(raw) {

  /* Sale-purchase fuzzy scorer — returns numeric score; <0 = definitive mismatch */
  scoreSalePurchase(s, p) {
    let score = 0;
    const sPlayer = (s.player||'').toLowerCase().trim();
    const pPlayer = (p.player||'').toLowerCase().trim();
    const sSerial = (s.serial||'').replace(/[^0-9]/g,'');
    const pSerial = (p.serial||'').replace(/[^0-9]/g,'');
    const sVar    = (s.variation||'').toLowerCase().trim();
    const pVar    = (p.variation||'').toLowerCase().trim();
    const sYear   = (s.year||'').trim();
    const pYear   = (p.year||'').trim();
    const sSet    = (s.set||'').toLowerCase().trim();
    const pSet    = (p.set||'').toLowerCase().trim();

    if (sSerial && pSerial) {
      if (sSerial === pSerial) score += 55;
      else return -999;
    }
    if (sPlayer && pPlayer) {
      if (sPlayer === pPlayer) score += 30;
      else if (sPlayer.includes(pPlayer) || pPlayer.includes(sPlayer)) score += 12;
      else return -999;
    }
    if (sYear && pYear) {
      if (sYear === pYear) score += 15;
      else score -= 25;
    }
    if (sSet && pSet) {
      if (sSet === pSet) score += 20;
      else if (sSet.includes(pSet) || pSet.includes(sSet)) score += 8;
    }
    if (sVar && pVar) {
      if (sVar === pVar) score += 22;
      else if (sVar.includes(pVar) || pVar.includes(sVar)) score += 10;
      else score -= 10;
    }
    const sColor = _extractColor(sVar) || _extractColor((s.raw_title||s.title||'').toLowerCase());
    const pColor = _extractColor(pVar) || _extractColor((p.display_name||p.raw_title||'').toLowerCase());
    if (sColor && pColor) {
      if (sColor === pColor) score += 12;
      else score -= 20;
    }
    if (s.type && p.type && s.type === p.type) score += 8;
    if (s.grade && p.grade && s.grade === p.grade) score += 8;
    if (s.is_auto && p.is_auto) score += 6;
    else if (s.is_auto && !p.is_auto) score -= 8;

    const sTitle = (s.raw_title || s.title || '').toLowerCase();
    const sw = new Set(sTitle.split(/\W+/).filter(w => w.length > 3));
    const pWords = (p.display_name || p.raw_title || '').toLowerCase();
    const pw = new Set(pWords.split(/\W+/).filter(w => w.length > 3));
    let overlap = 0;
    sw.forEach(w => { if (pw.has(w)) overlap++; });
    score += Math.min(overlap * 2, 10);

    return score;
  },

  /* Returns top card candidates for linking to a sale */
  getTopCandidates(sale, n = 10) {
    const sold = Computed.soldCardIds();
    const alreadyLinked = new Set(sale.linked_card_ids || []);
    return Store.get('cards')
      .filter(c => !sold.has(c.id) || alreadyLinked.has(c.id))
      .map(c => ({ id: c.id, score: Parsers.scoreSalePurchase(sale, c) }))
      .filter(c => c.score > 20)
      .sort((a, b) => b.score - a.score)
      .slice(0, n);
  },

  /* eBay order CSV → array of card draft objects (new schema) */
  parseOrderCsv(text) {
    if (!text || !text.trim()) return { records:[], skipped:0, duplicates:0, error:'No text provided' };
    const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return { records:[], skipped:0, duplicates:0, error:'Need header + data rows' };

    const delim  = _detectDelim(lines[0]);
    const header = _csvSplitRow(lines[0], delim).map(h => h.toLowerCase().replace(/['"]/g,'').trim());
    const col    = _csvCols(header);

    const iName    = col(['title','itemtitle','name','card','description','item']);
    const iCost    = col(['cost','price','paid','amount','purchaseprice','totalprice']);
    const iDate    = col(['date','purchasedate','orderdate','bought','saledate']);
    const iPlayer  = col(['player','subject','athlete','person']);
    const iSeller  = col(['seller','source','vendor','from','sellerid']);
    const iType    = col(['type','sport','category']);
    const iYear    = col(['year']);
    const iSet     = col(['set','series']);
    const iGrade   = col(['grade','grading']);
    const iNotes   = col(['notes','note','comments']);
    const iOrderNum= col(['ordernumber','orderid','ordernum','order#','transactionid']);
    const iItemId  = col(['itemnumber','itemid','item number','listingid','ebayitemid','item#']);

    if (iName < 0) return { records:[], skipped:0, duplicates:0, error:'No title column. Got: '+header.join(', ') };

    const existingItemIds = new Set(Store.get('cards').map(c => c.item_id).filter(Boolean));
    const records = []; let skipped = 0, duplicates = 0;
    const g  = (cells, i) => i >= 0 ? (cells[i]||'').replace(/['"]/g,'').trim() : '';
    const gn = (cells, i) => parseFloat(g(cells,i).replace(/[^0-9.]/g,'')) || 0;

    for (let r = 1; r < lines.length; r++) {
      const cells   = _csvSplitRow(lines[r], delim);
      const rawTitle = g(cells, iName);
      if (!rawTitle) { skipped++; continue; }
      const itemId = g(cells, iItemId);
      if (itemId && existingItemIds.has(itemId)) { duplicates++; continue; }

      const cleanTitle = rawTitle.replace(/\s*\|\s*Quantity:\s*\d+.*/i,'').replace(/^\d+\s+x\s+/i,'').trim();
      const parsed  = Parsers.parseCardTitle(cleanTitle);
      const player  = g(cells, iPlayer)  || parsed.player;
      const type    = g(cells, iType)    || parsed.type;
      const year    = g(cells, iYear)    || parsed.year;
      const set     = g(cells, iSet)     || parsed.set;
      const grade   = g(cells, iGrade)   || parsed.grade;
      const costRaw = gn(cells, iCost);
      const lotQty  = Math.max(parsed.lot_qty || 1, 1);
      const now     = new Date().toISOString();

      const draft = {
        id:           null,  // assigned when committed
        raw_title:    rawTitle,
        display_name: player ? buildStandardName({...parsed, player, year, set, grade}) : (parsed.display_name || cleanTitle),
        raw_cost:     String(costRaw),
        raw_date:     g(cells, iDate),
        source:       'ebay_csv',
        order_num:    g(cells, iOrderNum),
        item_id:      itemId,
        seller:       g(cells, iSeller),
        player, year, set,
        variation:    parsed.variation,
        serial:       parsed.serial,
        grade,
        is_auto:      parsed.is_auto,
        is_rc:        parsed.is_rc,
        is_lot:       parsed.is_lot,
        lot_qty:      lotQty,
        type,
        cost:         costRaw / lotQty,
        photos:       [],
        notes:        g(cells, iNotes),
        tags:         [],
        _customPlayer: parsed._customPlayer,
        created_at:   now,
        updated_at:   now,
      };
      records.push(draft);
    }
    return { records, skipped, duplicates };
  },

  /* eBay sold CSV → array of sale draft objects (new schema) */
  parseSaleCsv(text) {
    if (!text || !text.trim()) return { records:[], skipped:0, error:'No text provided' };
    const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return { records:[], skipped:0, error:'Need header + data rows' };

    const delim  = _detectDelim(lines[0]);
    const header = _csvSplitRow(lines[0], delim).map(h => h.toLowerCase().replace(/['"]/g,'').trim());
    const col    = _csvCols(header);

    const iTitle    = col(['title','itemtitle','item title','name','card','description']);
    const iPrice    = col(['soldfor','saleamount','saleprice','totalprice','itemprice','price','amount']);
    const iDate     = col(['saledate','orderdate','date','solddate','created date']);
    const iOrderNum = col(['ordernumber','orderid','ordernum','order#','transactionid']);
    const iQty      = col(['quantity','qty','quantitysold']);
    const iBuyer    = col(['buyer','buyerusername','buyername','buyerid']);
    const iItemNum  = col(['itemnumber','itemid','item number','listingid']);
    const iType     = col(['type','sport','category']);
    const iPlayer   = col(['player','playercard','subject','athlete']);
    const iYear     = col(['year']);
    const iSet      = col(['set','setname','series']);
    const iGrade    = col(['grade','grading']);
    const iSerial   = col(['serial','serialnumber','serial number','serial#']);
    const iVar      = col(['parallel','variation']);
    const iBuyerShip= col(['buyerpaidship','buyershipcost','shipping','buyershipping','buyer paid ship']);
    const iFees     = col(['totalfees','total fees','fees','ebay fees','platformfees']);
    const iPlatform = col(['platform','marketplace','channel']);

    if (iTitle < 0) return { records:[], skipped:0, error:'No title column. Got: '+header.join(', ') };

    const records = []; let skipped = 0;
    const g  = (cells, i) => i >= 0 ? (cells[i]||'').replace(/['"]/g,'').trim() : '';
    const gn = (cells, i) => parseFloat(g(cells,i).replace(/[^0-9.]/g,'')) || 0;

    for (let r = 1; r < lines.length; r++) {
      const cells    = _csvSplitRow(lines[r], delim);
      let rawTitle   = g(cells, iTitle);
      if (!rawTitle) { skipped++; continue; }
      rawTitle = rawTitle.replace(/\s*\|\s*Quantity:\s*\d+.*/i,'').replace(/^\d+\s+x\s+/i,'').trim();

      const parsed   = Parsers.parseCardTitle(rawTitle);
      const player   = g(cells, iPlayer)  || parsed.player;
      const type     = g(cells, iType)    || parsed.type;
      const year     = g(cells, iYear)    || parsed.year;
      const set      = g(cells, iSet)     || parsed.set;
      const grade    = g(cells, iGrade)   || parsed.grade;
      const serial   = g(cells, iSerial).replace(/[^0-9\/]/g,'') || parsed.serial || '';
      const variation= g(cells, iVar)     || parsed.variation || '';
      const now      = new Date().toISOString();

      records.push({
        id:              null,
        raw_title:       rawTitle,
        raw_price:       g(cells, iPrice),
        raw_date:        g(cells, iDate),
        source:          'ebay_csv',
        platform:        g(cells, iPlatform) || 'eBay',
        order_num:       g(cells, iOrderNum),
        buyer:           g(cells, iBuyer),
        player, year, set, variation, serial, grade,
        is_auto:         parsed.is_auto,
        type,
        title:           player ? buildStandardName({...parsed, player, year, set, grade, variation, serial}) : rawTitle,
        price:           gn(cells, iPrice),
        qty:             parseInt(g(cells, iQty)) || 1,
        fees:            gn(cells, iFees),
        buyer_ship:      gn(cells, iBuyerShip),
        linked_card_ids: [],
        photos:          [],
        notes:           '',
        _customPlayer:   parsed._customPlayer,
        created_at:      now,
        updated_at:      now,
      });
    }
    return { records, skipped };
  },
};

/* ══════════════════════════════════════════════════════
   §5  COMPUTED  (derived values)
══════════════════════════════════════════════════════ */
const Computed = {
  soldCardIds() {
    const ids = new Set();
    Store.get('sales').forEach(s =>
      (s.linked_card_ids || []).forEach(id => ids.add(id))
    );
    return ids;
  },

  invCards() {
    const sold = this.soldCardIds();
    return Store.get('cards').filter(c => !sold.has(c.id));
  },

  invCount() { return this.invCards().length; },

  totalCostBasis() {
    return this.invCards().reduce((sum, c) => sum + (c.cost || 0), 0);
  },

  totalRevenue() {
    return Store.get('sales').reduce((sum, s) => sum + (s.price || 0), 0);
  },

  totalFees() {
    return Store.get('sales').reduce((sum, s) => sum + (s.fees || 0) + (s.buyer_ship || 0), 0);
  },

  totalProfit() {
    const revenue = this.totalRevenue();
    const fees = this.totalFees();
    const sold = this.soldCardIds();
    const cogs = Store.get('cards')
      .filter(c => sold.has(c.id))
      .reduce((sum, c) => sum + (c.cost || 0), 0);
    return revenue - fees - cogs;
  },

  cardFinancials(id) {
    const card = Store.getCard(id);
    if (!card) return null;
    const sale = Store.get('sales').find(s => (s.linked_card_ids || []).includes(id));
    const vl = Store.get('value_lookups')[id];
    const cost = card.cost || 0;
    const mktVal = vl?.avgPrice || 0;
    const salePrice = sale?.price || 0;
    const fees = sale ? (sale.fees || 0) + (sale.buyer_ship || 0) : 0;
    const isSold = !!sale;
    const pnl = isSold ? (salePrice - fees - cost) : (mktVal - cost);
    return { cost, mktVal, salePrice, fees, pnl, isSold, sale };
  },

  linkedPnl(saleId) {
    const sale = Store.getSale(saleId);
    if (!sale) return 0;
    const cogs = (sale.linked_card_ids || [])
      .reduce((sum, id) => sum + (Store.getCard(id)?.cost || 0), 0);
    return (sale.price || 0) - (sale.fees || 0) - (sale.buyer_ship || 0) - cogs;
  },
};

const Actions = {
  addCard(fields)         { toast('Actions.addCard — coming soon'); },
  updateCard(id, fields)  { Store.patchCard(id, fields); render(); toast('Saved'); },
  deleteCard(id)          { toast('Actions.deleteCard — coming soon'); },
  addSale(fields)         { toast('Actions.addSale — coming soon'); },
  updateSale(id, fields)  { Store.patchSale(id, fields); render(); toast('Saved'); },
  deleteSale(id)          { toast('Actions.deleteSale — coming soon'); },
  deleteCard(id) {
    const cards = Store.get('cards').filter(c => c.id !== id);
    Store.setCards(cards);
    DB.saveCards(cards);
    PhotoDB.deleteAll(id).catch(() => {});
    closePanel();
    render();
    toast('Card deleted');
  },

  linkCardToSale(cardId, saleId) {
    const sale = Store.getSale(saleId);
    if (!sale) return;
    const ids = new Set(sale.linked_card_ids || []);
    ids.add(cardId);
    Store.patchSale(saleId, { linked_card_ids: [...ids] });
    render();
    toast('Linked');
  },

  unlinkCardFromSale(cardId, saleId) {
    const sale = Store.getSale(saleId);
    if (!sale) return;
    const ids = (sale.linked_card_ids || []).filter(id => id !== cardId);
    Store.patchSale(saleId, { linked_card_ids: ids });
    render();
    toast('Unlinked');
  },
  async importCards(drafts) {
    if (!drafts || !drafts.length) return;
    const now = new Date().toISOString();
    const newCards = drafts.map(d => ({ ...d, id: d.id || newId('P') }));
    const cards = [...Store.get('cards'), ...newCards];
    Store.setCards(cards);
    await DB.saveCards(cards);
    // Register any newly discovered custom players
    const customs = new Set(Store.get('custom_players') || []);
    newCards.filter(c => c._customPlayer && c.player).forEach(c => customs.add(c.player));
    Store.patch('custom_players', [...customs]);
    render();
    toast(`Imported ${newCards.length} card${newCards.length===1?'':'s'}`);
  },

  async importSales(drafts) {
    if (!drafts || !drafts.length) return;
    const newSales = drafts.map(d => ({ ...d, id: d.id || newId('S') }));
    const sales = [...Store.get('sales'), ...newSales];
    Store.setSales(sales);
    await DB.saveSales(sales);
    render();
    toast(`Imported ${newSales.length} sale${newSales.length===1?'':'s'}`);
  },

  async attachPhoto(cardId, dataUrl) {
    const card = Store.getCard(cardId);
    if (!card) return;
    const index = (card.photos || []).length;
    await PhotoDB.put(cardId, index, dataUrl);
    Store.patchCard(cardId, { photos: [...(card.photos || []), `photo::${cardId}::${index}`] });
    render();
    toast('Photo attached');
  },

  async deletePhoto(cardId, index) {
    const card = Store.getCard(cardId);
    if (!card) return;
    await PhotoDB.delete(cardId, index);
    const photos = (card.photos || []).filter((_, i) => i !== index);
    Store.patchCard(cardId, { photos });
    render();
    toast('Photo removed');
  },

  async restoreBackup(file) {
    try {
      const data = await DB.importBackup(file);
      Store.loadFromBackup(data);
      render();
      toast(`Restored: ${data.cards.length} cards, ${data.sales.length} sales`);
    } catch(err) {
      toast(`Restore failed: ${err.message}`);
    }
  },
};

/* ── Utilities ── */
function newId(prefix = 'P') {
  const ts  = Date.now();
  const rnd = Math.random().toString(36).slice(2, 6);
  return `${prefix}_${ts}_${rnd}`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function f$(n) {
  if (n == null || n === '') return '—';
  return '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function toast(msg, dur = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), dur);
}

/* ── Routing ── */
function nav(page) {
  Store.patch('page', page);
  Store.patch('page_num', 0);
  Store.patch('filters', { q: '', type: '', status: '' });
  render();
}

function render() {
  const page = Store.get('page');
  const renderer = Pages[page];
  document.getElementById('main').innerHTML = renderer ? renderer() : Pages.dashboard();

  document.querySelectorAll('.ni').forEach(el => {
    el.classList.toggle('on', el.dataset.page === page);
  });

  updateSidebar();
}

function updateSidebar() {
  const inv  = Computed.invCount();
  const cost = Computed.totalCostBasis();
  const rev  = Computed.totalRevenue();
  const sfInv  = document.getElementById('sf-inv');
  const sfCost = document.getElementById('sf-cost');
  const sfRev  = document.getElementById('sf-rev');
  if (sfInv)  sfInv.textContent  = inv;
  if (sfCost) sfCost.textContent = f$(cost);
  if (sfRev)  sfRev.textContent  = f$(rev);
}

/* ── Filters & Sort ── */
function setFilter(key, val) {
  const filters = { ...Store.get('filters'), [key]: val };
  Store.patch('filters', filters);
  Store.patch('page_num', 0);
  render();
}

function setSort(field) {
  const cur = Store.get('sort');
  const dir = cur.field === field && cur.dir === 'asc' ? 'desc' : 'asc';
  Store.patch('sort', { field, dir });
  render();
}

function setPage(n) {
  Store.patch('page_num', n);
  render();
}

/* ── Panel ── */
function openPanel(html) {
  document.getElementById('pn').innerHTML = html;
  document.getElementById('ov').classList.add('open');
}

function closePanel() {
  document.getElementById('ov').classList.remove('open');
  document.getElementById('pn').innerHTML = '';
  Store.patch('panel', null);
}

          const c = Store.getCard(cid);
          return c
            ? `<div style="padding:7px 10px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:5px;font-size:12px;cursor:pointer" onclick="closePanel();openCardPanel('${cid}')">${esc(c.display_name||c.raw_title||cid)}</div>`

    </div>`);
}

/* ── Quick-add helpers (minimal, real implementation in Step 6) ── */
async function _quickAddCard() {
  const raw  = document.getElementById('rc-title')?.value?.trim();
  const cost = parseFloat(document.getElementById('rc-cost')?.value) || 0;
  const src  = document.getElementById('rc-source')?.value?.trim();
  if (!raw) { toast('Title is required'); return; }
  const now = new Date().toISOString();
  const card = {
    id: newId('P'),
    raw_title: raw,
    display_name: raw,
    cost,
    raw_cost: String(cost),
    source: src || null,
    photos: [],
    created_at: now,
    updated_at: now,
  };
  const cards = [...Store.get('cards'), card];
  Store.setCards(cards);
  await DB.saveCards(cards);
  closePanel();
  render();
  toast('Card added');
}

async function _quickAddSale() {
  const title    = document.getElementById('as-title')?.value?.trim();
  const price    = parseFloat(document.getElementById('as-price')?.value) || 0;
  const platform = document.getElementById('as-platform')?.value?.trim();
  if (!title) { toast('Title is required'); return; }
  const now = new Date().toISOString();
  const sale = {
    id: newId('S'),
    raw_title: title,
    title,
    price,
    raw_price: String(price),
    platform: platform || null,
    linked_card_ids: [],
    photos: [],
    fees: 0,
    buyer_ship: 0,
    created_at: now,
    updated_at: now,
  };
  const sales = [...Store.get('sales'), sale];
  Store.setSales(sales);
  await DB.saveSales(sales);
  closePanel();
  render();
  toast('Sale added');
}

function _panelField(label, val) {
  return `<div class="field-item">
    <label>${esc(label)}</label>
    <div class="field-val">${val != null && val !== '' ? esc(String(val)) : '<span style="color:var(--faint)">—</span>'}</div>
  </div>`;
}

/* ── eBay title builder ── */
function _ebayTitle(card) {
  const parts = [];
  if (card.player)    parts.push(card.player);
  if (card.variation) parts.push(card.variation);
  if (card.year)      parts.push(card.year);
  if (card.set)       parts.push(card.set);
  if (card.serial)    parts.push(card.serial.includes('/') ? card.serial : '/'+card.serial);
  if (card.grade)     parts.push(card.grade);
  if (card.is_auto && !/auto/i.test(card.variation||'')) parts.push('Auto');
  if (card.is_rc)     parts.push('RC');
  return parts.join(' ').trim();
}

function _copyEbayTitle(id, btn) {
  const el = document.getElementById(`cpq-etitle-${id}`);
  const text = el?.textContent?.trim() || _ebayTitle(Store.getCard(id)||{});
  if (!text) return;
  navigator.clipboard?.writeText(text).then(() => {
    const orig = btn.textContent; btn.textContent = '✓ Copied!';
    setTimeout(() => btn.textContent = orig, 1800);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    const orig = btn.textContent; btn.textContent = '✓ Copied!';
    setTimeout(() => btn.textContent = orig, 1800);
  });
}

/* ── Receive panel live preview ── */
function _rcPreview(title) {
  const el = document.getElementById('rc-preview');
  if (!el) return;
  if (!title.trim()) { el.style.display = 'none'; return; }
  const p = Parsers.parseCardTitle(title);
  const tags = [];
  if (p.player)    tags.push(`<strong>${esc(p.player)}</strong>`);
  if (p.year)      tags.push(`<span class="pt year" style="height:auto;padding:1px 5px">${esc(p.year)}</span>`);
  if (p.set)       tags.push(`<span class="pt set"  style="height:auto;padding:1px 5px">${esc(p.set)}</span>`);
  if (p.variation) tags.push(`<span class="pt var"  style="height:auto;padding:1px 5px">${esc(p.variation)}</span>`);
  if (p.serial)    tags.push(`<span class="pt serial" style="height:auto;padding:1px 5px">/${esc(p.serial)}</span>`);
  if (p.grade)     tags.push(`<span class="pt grade" style="height:auto;padding:1px 5px">${esc(p.grade)}</span>`);
  if (p.is_auto)   tags.push(`<span class="pt auto" style="height:auto;padding:1px 5px">AUTO</span>`);
  if (p.is_rc)     tags.push(`<span class="pt rc"   style="height:auto;padding:1px 5px">RC</span>`);
  if (p.type)      tags.push(Components.typeBadge(p.type));
  el.style.display = tags.length ? 'block' : 'none';
  el.innerHTML = `<div style="font-size:9px;color:var(--faint);font-family:var(--mono);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px">Parsed</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">${tags.join('')}</div>`;
}

/* ── Photo loading ── */
async function _loadCardPhotos(id) {
  const card = Store.getCard(id);
  if (!card || !(card.photos||[]).length) return;
  const urls = await PhotoDB.getAll(id).catch(() => []);
  const el   = document.getElementById(`cpq-photo-grid-${id}`);
  if (!el) return;
  el.innerHTML = urls.length
    ? urls.map((url, i) => `
        <div style="position:relative">
          <img src="${esc(url)}" style="width:80px;height:112px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:zoom-in;display:block" onclick="window.open(this.src)">
          <button onclick="Actions.deletePhoto('${id}',${i});openCardPanel('${id}')"
            style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);border:none;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;line-height:18px;text-align:center;padding:0">✕</button>
        </div>`).join('')
    : '<span style="font-size:11px;color:var(--faint)">No photos stored</span>';
}

/* ── CSV parse helpers ── */
let _cardDrafts = [], _saleDrafts = [];

function _parseCardsCsv() {
  const text = document.getElementById('imp-cards-csv')?.value || '';
  const result = Parsers.parseOrderCsv(text);
  const status = document.getElementById('imp-cards-status');
  const review = document.getElementById('imp-cards-review');
  if (result.error) { if (status) status.textContent = '✕ ' + result.error; return; }
  _cardDrafts = result.records;
  const notes = [];
  if (result.skipped)    notes.push(`${result.skipped} blank skipped`);
  if (result.duplicates) notes.push(`${result.duplicates} dupes skipped`);
  if (status) status.textContent = `${_cardDrafts.length} parsed${notes.length ? ' · '+notes.join(' · ') : ''}`;
  if (review) review.innerHTML = _renderCardDraftReview();
}

function _parseSalesCsv() {
  const text = document.getElementById('imp-sales-csv')?.value || '';
  const result = Parsers.parseSaleCsv(text);
  const status = document.getElementById('imp-sales-status');
  const review = document.getElementById('imp-sales-review');
  if (result.error) { if (status) status.textContent = '✕ ' + result.error; return; }
  _saleDrafts = result.records;
  const notes = result.skipped ? `${result.skipped} blank skipped` : '';
  if (status) status.textContent = `${_saleDrafts.length} parsed${notes ? ' · '+notes : ''}`;
  if (review) review.innerHTML = _renderSaleDraftReview();
}

function _renderCardDraftReview() {
  if (!_cardDrafts.length) return '';
  const rows = _cardDrafts.map((d, i) => `
    <div style="background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:8px 10px;margin-top:5px;font-size:11px">
      <div style="font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(d.raw_title)}">${esc(d.display_name || d.raw_title)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--dim)">
        ${d.player ? `<span style="color:var(--text)">${esc(d.player)}</span>` : ''}
        ${d.year   ? `<span class="pt year" style="height:auto;padding:1px 5px">${esc(d.year)}</span>` : ''}
        ${d.set    ? `<span class="pt set"  style="height:auto;padding:1px 5px">${esc(d.set)}</span>` : ''}
        ${d.serial ? `<span class="pt serial" style="height:auto;padding:1px 5px">/${esc(d.serial)}</span>` : ''}
        ${d.grade  ? `<span class="pt grade" style="height:auto;padding:1px 5px">${esc(d.grade)}</span>` : ''}
        ${d.is_auto ? `<span class="pt auto" style="height:auto;padding:1px 5px">AUTO</span>` : ''}
        ${d.is_rc   ? `<span class="pt rc"   style="height:auto;padding:1px 5px">RC</span>` : ''}
        <span style="margin-left:auto;color:var(--green);font-weight:600">${f$(d.cost)}</span>
      </div>
    </div>`).join('');
  return `
    <div style="margin-top:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:11px;font-family:var(--mono);color:var(--dim)">${_cardDrafts.length} cards ready to import</span>
        <button class="btn pri sm" style="margin-left:auto" onclick="_confirmCardImport()">✓ Import All</button>
        <button class="btn ghost sm" onclick="_cardDrafts=[];document.getElementById('imp-cards-review').innerHTML=''">✕</button>
      </div>
      <div style="max-height:280px;overflow-y:auto">${rows}</div>
    </div>`;
}

function _renderSaleDraftReview() {
  if (!_saleDrafts.length) return '';
  const rows = _saleDrafts.map((d, i) => `
    <div style="background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:8px 10px;margin-top:5px;font-size:11px">
      <div style="font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(d.raw_title)}">${esc(d.title || d.raw_title)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--dim)">
        ${d.player   ? `<span style="color:var(--text)">${esc(d.player)}</span>` : ''}
        ${d.platform ? `<span>${esc(d.platform)}</span>` : ''}
        ${d.raw_date ? `<span>${esc(d.raw_date)}</span>` : ''}
        <span style="margin-left:auto;color:var(--green);font-weight:600">${f$(d.price)}</span>
        ${d.fees     ? `<span style="color:var(--red)">-${f$(d.fees)} fees</span>` : ''}
      </div>
    </div>`).join('');
  return `
    <div style="margin-top:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:11px;font-family:var(--mono);color:var(--dim)">${_saleDrafts.length} sales ready to import</span>
        <button class="btn pri sm" style="margin-left:auto" onclick="_confirmSaleImport()">✓ Import All</button>
        <button class="btn ghost sm" onclick="_saleDrafts=[];document.getElementById('imp-sales-review').innerHTML=''">✕</button>
      </div>
      <div style="max-height:280px;overflow-y:auto">${rows}</div>
    </div>`;
}

async function _confirmCardImport() {
  await Actions.importCards(_cardDrafts);
  _cardDrafts = [];
  const review = document.getElementById('imp-cards-review');
  const status = document.getElementById('imp-cards-status');
  if (review) review.innerHTML = '';
  if (status) status.textContent = '';
  document.getElementById('imp-cards-csv').value = '';
}

async function _confirmSaleImport() {
  await Actions.importSales(_saleDrafts);
  _saleDrafts = [];
  const review = document.getElementById('imp-sales-review');
  const status = document.getElementById('imp-sales-status');
  if (review) review.innerHTML = '';
  if (status) status.textContent = '';
  document.getElementById('imp-sales-csv').value = '';
}

/* ── Restore helpers (called from Import page) ── */
function _handleRestoreFile(input) {
  const file = input.files?.[0];
  if (file) _confirmRestore(file);
  input.value = '';
}

function _handleRestoreDrop(event) {
  event.preventDefault();
  document.getElementById('restore-drop').style.borderColor = '';
  const file = event.dataTransfer.files?.[0];
  if (file) _confirmRestore(file);
}

function _confirmRestore(file) {
  const cards = Store.get('cards').length;
  const sales = Store.get('sales').length;
  if (cards + sales > 0) {
    if (!confirm(`This will replace your current ${cards} cards and ${sales} sales with the backup. Continue?`)) return;
  }
  Actions.restoreBackup(file);
}

/* ── Photo input trigger (called from card panel) ── */
function _triggerPhotoCapture(cardId) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.capture = 'environment';
  inp.onchange = async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = ev => res(ev.target.result);
      r.onerror = () => rej(r.error);
      r.readAsDataURL(file);
    });
    await Actions.attachPhoto(cardId, dataUrl);
  };
  inp.click();
}

/* ── Boot ── */
document.addEventListener('DOMContentLoaded', async () => {
  const data = await DB.load();
  Store.setCards(data.cards);
  Store.setSales(data.sales);
  Store.patch('value_lookups', data.value_lookups);

  // Warm up IndexedDB connection in background
  PhotoDB.open().catch(err => console.warn('PhotoDB init:', err));

  render();
});
</script>
